{% extends 'store/base.html' %}
{% block title %}Login — ShopZone{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo"><i class="fas fa-bolt"></i></div>
      <h1>Welcome Back!</h1>
      <p>Sign in to your ShopZone account</p>
    </div>

    <form method="POST" class="auth-form">
      {% csrf_token %}
      <div class="form-group">
        <label for="username"><i class="fas fa-user"></i> Username</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" required autofocus />
      </div>
      <div class="form-group">
        <label for="password"><i class="fas fa-lock"></i> Password</label>
        <div class="password-wrap">
          <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required />
          <button type="button" class="toggle-password" onclick="togglePass('password')">
            <i class="fas fa-eye" id="password-eye"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-primary btn-block btn-lg">
        <i class="fas fa-sign-in-alt"></i> Sign In
      </button>
    </form>

    <div class="auth-divider"><span>or</span></div>
    <p class="auth-switch">
      Don't have an account?
      <a href="{% url 'register' %}">Create one free <i class="fas fa-arrow-right"></i></a>
    </p>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function togglePass(id) {
  const input = document.getElementById(id);
  const icon = document.getElementById(id + '-eye');
  if (input.type === 'password') {
    input.type = 'text';
    icon.className = 'fas fa-eye-slash';
  } else {
    input.type = 'password';
    icon.className = 'fas fa-eye';
  }
}
</script>
{% endblock %}
